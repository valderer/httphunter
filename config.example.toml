[proxy]
listen = "127.0.0.1:8080"
mitm = true
# Domains in this list use a normal CONNECT tunnel instead of HTTPS MITM.
mitm_exclude = ["bilibili.com"]
connect_timeout_ms = 10000
request_timeout_ms = 30000

[capture]
enabled = false
max_body_bytes = 10485760
store_binary = true
store_compressed = true

[privacy]
redact_headers = [
    "authorization",
    "cookie",
    "set-cookie",
    "proxy-authorization",
    "x-api-key"
]

[api]
enabled = true
listen = "127.0.0.1:9090"

[system_proxy]
# macOS network service used by the Start/Stop button. Run `networksetup -listallnetworkservices` to check.
network_service = "Wi-Fi"

[logging]
level = "info"
