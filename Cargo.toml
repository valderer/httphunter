[workspace]
members = ["crates/hunter-core"]
resolver = "2"

[package]
name = "httphunter"
version = "0.1.0"
edition = "2021"
description = "A local HTTP debugging proxy written in Rust"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hunter-core = { path = "crates/hunter-core" }
http = "1"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
